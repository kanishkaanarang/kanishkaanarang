<text x="34" y="98" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1">Reconstructs subsurface ocean temperature and salinity at 15 depths by</text><text x="34" y="120" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1">fusing 6 satellite and reanalysis sources, trained on 71,380 QC'd profiles.</text><text x="34" y="142" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1">SHAP explainability · FastAPI/Streamlit dashboard · 82 automated tests.</text><rect x="34" y="172" width="118.2" height="26" rx="13" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="93.1" y="189" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#38bdf8">0.271 °C RMSE</text><rect x="162.2" y="172" width="125.60000000000001" height="26" rx="13" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="225.0" y="189" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#38bdf8">0.103 PSU RMSE</text><rect x="297.8" y="172" width="140.4" height="26" rx="13" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="368.0" y="189" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#38bdf8">3.7x lower error</text>
